[uwsgi]
#application's base folder
base = /path/to/your/app

#python module to import
app = wsgi
module = %(app):application

#socket file's location
socket = %(base)/app.sock

#permissions for the socket file
chmod-socket = 666

#the variable that holds a flask application inside the module imported
callable = application

#location of log files
logto = %(base)/logs/uwsgi.log

#number of processes
processes = 4

#number of threads per process
threads = 2

#enable master process
master = true

#automatically kill workers on exit
die-on-term = true

#respawn processes that take more than 30 seconds
harakiri = 30

#respawn processes after serving 1000 requests
max-requests = 1000

#clear environment on exit
vacuum = true

#enable Python threads
enable-threads = true

#buffer size for HTTP headers
buffer-size = 32768

#route requests with /lessons prefix (это обрабатывается dispatcher middleware)
#mount = /lessons=wsgi.py
manage-script-name = true

#set application name in stats
stats-uri = /stats

#reload when files change
py-autoreload = 1 