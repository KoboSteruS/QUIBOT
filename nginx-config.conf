server {
    listen 80;
    server_name 1c.analizator.mp;

    # Перенаправление на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 1c.analizator.mp;

    # Настройки SSL
    ssl_certificate /etc/letsencrypt/live/1c.analizator.mp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1c.analizator.mp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Настройки безопасности
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;

    # Корневая директория сайта
    # root /path/to/your/app;

    # Маршрутизация статических файлов
    location /lessons/static/ {
        alias /path/to/your/app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Основной прокси-маршрут к Flask-приложению
    location /lessons {
        include uwsgi_params;
        uwsgi_pass unix:/path/to/your/app/app.sock;
        uwsgi_param SCRIPT_NAME /lessons;
        uwsgi_modifier1 30;
    }

    # Перенаправление с / на /lessons
    location = / {
        return 301 /lessons;
    }

    # Обработка ошибок
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Логи
    access_log /var/log/nginx/1c.analizator.mp.access.log;
    error_log /var/log/nginx/1c.analizator.mp.error.log;
} 