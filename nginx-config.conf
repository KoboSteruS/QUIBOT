server {
    listen 80;
    server_name 1c.analizator.mp;

    # Перенаправление HTTP на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 1c.analizator.mp;

    # Настройки SSL
    ssl_certificate /etc/letsencrypt/live/1c.analizator.mp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1c.analizator.mp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Настройки безопасности
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;

    # Корневая директория сайта
    # root /path/to/your/app;

    # Маршрутизация статических файлов - важно разместить до обработки /lessons
    # для предотвращения обработки статических файлов через uwsgi
    location /lessons/static/ {
        alias /path/to/your/app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # Если приходят 404 ошибки для статики, разкомментируйте для логирования
        # access_log /var/log/nginx/static.access.log;
        # error_log /var/log/nginx/static.error.log;
    }

    # Основной прокси-маршрут к Flask-приложению
    location /lessons {
        include uwsgi_params;
        uwsgi_pass unix:/path/to/your/app/app.sock;
        
        # Устанавливаем SCRIPT_NAME для корректной работы префикса URL в Python
        uwsgi_param SCRIPT_NAME /lessons;
        
        # Модификатор для работы префикса с Flask
        uwsgi_modifier1 30;
        
        # Если у вас проблемы с длинными запросами, разкомментируйте:
        # uwsgi_read_timeout 300;
    }

    # Перенаправление с корня на /lessons
    # Это должно соответствовать логике в dummy_app в app.py
    location = / {
        return 301 /lessons;
    }

    # Перенаправление запросов к другим несуществующим путям в корне на /lessons
    location / {
        try_files $uri $uri/ /lessons;
    }

    # Обработка ошибок с корректными файлами
    error_page 404 /lessons/404.html;
    error_page 500 502 503 504 /lessons/500.html;

    # Логи
    access_log /var/log/nginx/1c.analizator.mp.access.log;
    error_log /var/log/nginx/1c.analizator.mp.error.log;
} 